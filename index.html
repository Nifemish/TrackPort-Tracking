<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<script>
/* Same deep-link rules as the TrackPort app: ?track= ?tn= ?tracking= ?id= ?go=track/ID ?pickup= ?receipt= /track/ID -> #/track/ID */
(function(){try{var L=location,q=new URLSearchParams(L.search),re=/^#\/?(track|pickup|shipment-receipt)\//,mode='track',m;
var id=q.get('track')||q.get('tn')||q.get('tracking')||q.get('trackingNumber')||q.get('id')||'';
if(q.get('pickup')){id=q.get('pickup');mode='pickup'}
if(q.get('receipt')){id=q.get('receipt');mode='shipment-receipt'}
if(q.get('go')&&(m=q.get('go').match(/^\/?(track|pickup|shipment-receipt)\/(.+)$/i))){mode=m[1].toLowerCase();id=m[2]}
if(!id&&(m=L.pathname.match(/\/(track|pickup|shipment-receipt)\/([^\/?#]+)/i))){mode=m[1].toLowerCase();id=decodeURIComponent(m[2])}
if(id&&!re.test(L.hash))history.replaceState(null,'',L.pathname.replace(/\/(track|pickup|shipment-receipt)\/[^\/]*$/i,'/')+'#/'+mode+'/'+encodeURIComponent(String(id).trim()));
var t=null;try{t=localStorage.getItem('tp_theme')}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1">
<title>TrackPort Tracking — Follow any package or flight</title>
<meta name="description" content="Enter a package or flight tracking number to see live status, route and location on TrackPort.">
<meta property="og:title" content="TrackPort Tracking"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f3f5f1;--sf:#fff;--sf2:#eaeee9;--ink:#101311;--mu:#667069;--ln:#dbe1da;--ac:#FF5E14;--ac2:#FF8A4C;--ok:#1f9d55;--bad:#d93a3a;--sh:0 22px 55px rgba(17,25,21,.10);--e:cubic-bezier(.16,1,.3,1);--serif:"Marcellus",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#090e0c;--sf:#111a16;--sf2:#17211d;--ink:#eef2ee;--mu:#8f9a93;--ln:#233029;--sh:0 22px 55px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 16px/1.6 var(--sans);background:var(--bg);color:var(--ink);transition:background .5s,color .5s;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:0 22px}.mu{color:var(--mu)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(30px,4.6vw,52px)}
@keyframes pageIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,94,20,.55)}100%{box-shadow:0 0 0 22px rgba(255,94,20,0)}}
@keyframes sh{to{background-position:-200% 0}}
#app.in{animation:pageIn .72s var(--e) both}
.rv{opacity:0;transform:translateY(26px);transition:opacity .85s var(--e),transform .85s var(--e)}.rv.on{opacity:1;transform:none}
/* nav */
#nav{position:fixed;inset:0 0 auto;z-index:50;padding:calc(12px + env(safe-area-inset-top)) 0 12px;transition:background .4s,box-shadow .4s}
#nav.sc,body[data-v=tk] #nav{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--ln)}
#nav .wrap{display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:10px;font:400 25px var(--serif);color:#fff}
#nav.sc .logo,body[data-v=tk] .logo{color:var(--ink)}
.logo svg{width:30px;height:30px}
.nl{display:flex;gap:4px;margin-left:auto}.nl button{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;color:#ffffffcc;transition:.3s}
#nav.sc .nl button,body[data-v=tk] .nl button{color:var(--mu)}.nl button:hover{color:var(--ac)!important}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff44;color:#fff;transition:.4s var(--e)}
#nav.sc .ib,body[data-v=tk] .ib{border-color:var(--ln);color:var(--ink)}.ib:hover{transform:rotate(18deg) scale(1.06);border-color:var(--ac)}
.ib svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:99px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 12px 28px rgba(255,94,20,.32);transition:transform .4s var(--e),box-shadow .4s}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(255,94,20,.4)}.btn.g{background:var(--sf);color:var(--ink);box-shadow:none;border:1px solid var(--ln)}
@media(max-width:860px){.nl{display:none}.ib{margin-left:auto}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;color:#fff;overflow:hidden;background:#0c1210}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}.sl.on{opacity:1;animation:kb 8s linear both}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,11,9,.88) 8%,rgba(7,11,9,.5) 55%,rgba(7,11,9,.25)),linear-gradient(0deg,var(--bg) 0,transparent 22%)}
.hero .wrap{position:relative;z-index:2;padding-top:110px;padding-bottom:110px}
.hero h1{font-size:clamp(44px,8vw,96px);max-width:11ch}.hero p{max-width:46ch;margin:22px 0 34px;font-size:18px;color:#ffffffcc}
.sb{display:flex;gap:10px;padding:10px;border-radius:99px;max-width:620px;background:#ffffff1c;border:1px solid #ffffff3a;backdrop-filter:blur(18px)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 16px var(--sans);padding:0 18px}.sb input::placeholder{color:#ffffff99}
.hint{margin-top:14px;font-size:13px;color:#ffffffaa}
.dots{position:absolute;z-index:3;right:max(22px,calc((100vw - 1180px)/2 + 22px));bottom:70px;display:flex;gap:8px}
.dots b{width:10px;height:10px;border-radius:99px;background:#ffffff66;cursor:pointer;transition:.5s var(--e)}.dots b.on{width:34px;background:var(--ac)}
/* sections */
.sec{padding:100px 0}.sh{max-width:640px;margin-bottom:46px}.sh p{margin-top:14px;color:var(--mu)}
.mqw{overflow:hidden;padding:26px 0;border-block:1px solid var(--ln);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq{display:flex;gap:18px;width:max-content;animation:mq 38s linear infinite}.chip{display:flex;align-items:center;gap:10px;height:58px;padding:0 22px;border-radius:99px;background:#fff;border:1px solid var(--ln);font-weight:600;color:#14161c;white-space:nowrap}
.chip img{height:30px;max-width:90px;object-fit:contain}
.mk{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:9px;color:#fff;font:700 12px var(--sans)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:26px;overflow:hidden}
.stats div{background:var(--sf);padding:38px 26px}.stats b{display:block;font:400 clamp(38px,5vw,60px) var(--serif);color:var(--ac)}.stats span{color:var(--mu);font-size:14px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:30px;transition:transform .5s var(--e),box-shadow .5s}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}.card h3{font-size:25px;margin:16px 0 8px}.card p{color:var(--mu);font-size:15px}.bento .w2{grid-column:span 2;background:linear-gradient(135deg,#0c1210,#17211d);color:#fff;border-color:transparent}.bento .w2 p{color:#ffffffaa}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}.steps .card:before{counter-increment:s;content:counter(s);font:400 54px var(--serif);color:var(--ac)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:14px}.gal figure{position:relative;border-radius:20px;overflow:hidden}
.gal figure:nth-child(1){grid-column:span 2;grid-row:span 2}.gal figure:nth-child(4){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--e)}.gal figure:hover img{transform:scale(1.08)}
.gal figcaption{position:absolute;inset:auto 0 0;padding:34px 18px 16px;color:#fff;font-size:14px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.post{border-radius:22px;overflow:hidden;background:var(--sf);border:1px solid var(--ln);transition:transform .5s var(--e),box-shadow .5s}.post:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.post img{height:210px;width:100%;object-fit:cover}.post div{padding:24px}.post small{color:var(--ac);font-weight:600}.post h3{font-size:23px;margin:8px 0}.post p{color:var(--mu);font-size:15px}
.tst{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:stretch}.tst>img{border-radius:26px;height:100%;min-height:380px;object-fit:cover}
.q{display:none;flex-direction:column;justify-content:center;padding:10px 0}.q.on{display:flex;animation:pageIn .72s var(--e) both}.q blockquote{font:400 clamp(24px,3vw,34px)/1.3 var(--serif)}
.who{display:flex;align-items:center;gap:14px;margin-top:26px}.who img,.cm img{width:48px;height:48px;border-radius:50%;object-fit:cover}.who b{display:block}.who span{font-size:14px;color:var(--mu)}
.qd{display:flex;gap:8px;margin-top:30px}.qd b{width:34px;height:4px;border-radius:9px;background:var(--ln);cursor:pointer;transition:.4s}.qd b.on{background:var(--ac)}
.cms{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.cm{display:flex;gap:14px;padding:22px;border-radius:20px;background:var(--sf);border:1px solid var(--ln)}.cm p{font-size:15px;margin-top:4px}.cm span{font-size:13px;color:var(--mu)}
.cta{border-radius:32px;padding:70px 30px;text-align:center;color:#fff;background:linear-gradient(135deg,rgba(12,18,16,.86),rgba(12,18,16,.7)),var(--cb) center/cover}
.cta h2{max-width:16ch;margin:0 auto 26px}.cta .sb{margin:0 auto}
footer{padding:60px 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);color:var(--mu);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}footer .logo{color:var(--ink)}
/* tracking */
.tk{padding-top:112px;padding-bottom:80px}.bk{display:inline-flex;gap:8px;align-items:center;color:var(--mu);font-size:14px;margin-bottom:20px}.bk:hover{color:var(--ac)}
.tc{background:var(--sf);border:1px solid var(--ln);border-radius:26px;padding:26px;box-shadow:var(--sh);margin-bottom:18px}
.top{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}.pic{aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--sf2);display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:cover}.pic svg{width:70px;stroke:var(--mu);fill:none;stroke-width:1.2}
.cb{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--sf2);font-weight:600;font-size:14px}.cb img{height:32px;width:auto;max-width:76px;object-fit:contain;background:#fff;border-radius:9px;padding:3px 6px}
.top h1{font-size:clamp(30px,4.6vw,50px);margin:14px 0}
.tn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:600 14px ui-monospace,Menlo,monospace}.tn button{display:inline-flex;gap:6px;align-items:center;padding:7px 13px;border-radius:99px;border:1px solid var(--ln);font:500 13px var(--sans);color:var(--mu);transition:.3s}.tn button:hover{border-color:var(--ac);color:var(--ac)}
.tn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 18px;border-radius:99px;font-weight:600;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}.pill:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);animation:pulse 2s infinite}
.rail{position:relative;display:flex;justify-content:space-between;gap:6px;padding:8px 0;overflow-x:auto}.rail:before,.rail:after{content:"";position:absolute;left:5%;top:27px;height:3px;border-radius:9px;background:var(--ln)}.rail:before{right:5%}.rail:after{width:calc(var(--p)*.9);background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1.4s var(--e)}
.st{position:relative;z-index:1;flex:1;min-width:84px;text-align:center;font-size:12.5px;color:var(--mu)}.st i{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 10px;border-radius:50%;background:var(--sf);border:3px solid var(--ln)}
.st.dn i{background:var(--ac);border-color:var(--ac);color:#fff}.st.ac i{border-color:var(--ac);box-shadow:0 0 0 7px color-mix(in srgb,var(--ac) 18%,transparent)}.st.ac{color:var(--ink);font-weight:600}.st svg{width:16px;stroke:#fff;fill:none;stroke-width:3}
.bp{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;text-align:center}.bp b{display:block;font:400 clamp(44px,8vw,84px)/1 var(--serif)}.bp span{color:var(--mu);font-size:14px}.bp svg{width:44px;stroke:var(--ac);fill:none;stroke-width:1.6;justify-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}.grid div{padding:14px 16px;border-radius:16px;background:var(--sf2)}.grid span{display:block;font-size:12px;color:var(--mu)}.grid b{font-weight:600;font-size:15px;word-break:break-word}
.tc h3{font-size:26px;margin-bottom:16px}.map{height:min(460px,62vh);border-radius:20px;overflow:hidden;background:var(--sf2);z-index:0}
.mh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}.mh h3{margin:0}
[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}.leaflet-popup-content{font:500 13px var(--sans)}
.pin{width:26px;height:26px;border-radius:50%;background:var(--ac);border:4px solid #fff;animation:pulse 1.8s infinite}
.ev{position:relative;padding:0 0 24px 30px;border-left:2px solid var(--ln);margin-left:7px}.ev:last-child{padding-bottom:0}.ev:before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--sf);border:3px solid var(--ln)}.ev:first-child:before{background:var(--ac);border-color:var(--ac)}
.ev b{display:block}.ev span{font-size:14px;color:var(--mu)}.ban{display:flex;gap:12px;padding:16px 18px;border-radius:16px;margin-top:20px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-size:14px}
.sk{height:260px;border-radius:26px;margin-bottom:18px;background:linear-gradient(90deg,var(--sf2) 30%,var(--sf) 50%,var(--sf2) 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite}
.nf{text-align:center;padding:60px 20px}.nf h1{font-size:clamp(32px,5vw,52px);margin-bottom:12px}.nf .sb{margin:28px auto 0;background:var(--sf);border-color:var(--ln)}.nf .sb input{color:var(--ink)}.nf .sb input::placeholder{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;padding:12px 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;transition:.5s var(--e);z-index:99;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.bento,.steps,.posts,.tst,.cms{grid-template-columns:1fr}.bento .w2{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.gal{grid-template-columns:repeat(2,1fr);grid-auto-rows:160px}.gal figure:nth-child(1){grid-column:span 2}.top{grid-template-columns:1fr}.pic{max-width:300px}.tst>img{min-height:260px}.dots{bottom:40px}.sec{padding:70px 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>

<body data-v="home">
<header id="nav"><div class="wrap">
<a class="logo" href="#/" aria-label="TrackPort home"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#FF5E14"/><path d="M8 11h16M16 11v13M10 24h12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>TrackPort</a>
<nav class="nl" aria-label="Sections"><button data-s="services">Services</button><button data-s="how">How it works</button><button data-s="gallery">Gallery</button><button data-s="updates">Updates</button><button data-s="reviews">Reviews</button></nav>

</div></header>

<footer><div class="wrap"><a class="logo" href="#/">TrackPort</a><span>Read-only tracking. No sign-in needed, just your tracking number.</span><span>© <span id="yr"></span> TrackPort</span></div></footer>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',plane:'<path d="M2 16l9-3V6a2 2 0 0 1 4 0v7l7 3v2l-7-1.5V20l2 1.5V23l-4-1-4 1v-1.5L11 20v-3.5L2 18z" transform="scale(.9) translate(1 0)"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v9"/>',check:'<path d="M5 12l5 5 9-10"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',alert:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function setTheme(t){document.documentElement.dataset.theme=t;store.set('tp_theme',t);$('meta[name=theme-color]').content=t==='dark'?'#090e0c':'#f3f5f1';$('#tg').innerHTML=ic(t==='dark'?'sun':'moon')}
$('#tg').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme);

const CFG={apiKey:'AIzaSyAgq9j2fCk1hs5NzejuToFaqBpcN4UnYW0',authDomain:'trackport-7ca87.firebaseapp.com',projectId:'trackport-7ca87',storageBucket:'trackport-7ca87.firebasestorage.app',messagingSenderId:'431477975794',appId:'1:431477975794:web:48216682b1482d0fd77e6b'};
let db=null;try{firebase.initializeApp(CFG);db=firebase.firestore()}catch(e){console.warn('[TrackPort] Firebase unavailable',e)}
const docId=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,140);
const parse=s=>{try{return JSON.parse(s)}catch(e){return null}};
async function lookup(raw){
 const id=String(raw||'').trim();if(!id||!db)return{err:'offline'};
 const vs=[...new Set([id,id.toUpperCase(),id.toLowerCase()])];let err=null,hit=null;
 const done=(rec,type)=>({rec,type:type||(rec&&rec.flightNo?'flight':'shipment')});
 for(const v of vs){try{const s=await db.collection('trackportPublic').doc(docId(v)).get();if(s.exists){const d=s.data(),r=parse(d.data);if(r)return fill(done(r,d.type))}}catch(e){err=e}}
 try{const q=await db.collection('trackportPublic').where('trackingNumberLower','==',id.toLowerCase()).limit(1).get();if(!q.empty){const d=q.docs[0].data(),r=parse(d.data);if(r)return fill(done(r,d.type))}}catch(e){err=err||e}
 for(const v of vs){try{const s=await db.collection('nbatoolsState').doc('trackport-record-'+docId(v)).get();if(s.exists){const d=s.data(),r=parse(d.value);if(r)return done(r,d.type)}}catch(e){err=err||e}}
 return err&&err.code==='permission-denied'?{err:'denied'}:err?{err:'net'}:null}
async function fill(o){const r=o.rec;if(o.type!=='flight'&&r.imageInRecord&&!(r.productImage||r.imageUrl)){try{const s=await db.collection('nbatoolsState').doc('trackport-record-'+docId(r.trackingNumber)).get(),f=s.exists&&parse(s.data().value);if(f)r.productImage=f.productImage||f.imageUrl||''}catch(e){}}return o}

function brand(name,air,logo){const k=String(name||'').toLowerCase(),b=(air?AIR:CAR).find(x=>k.includes(x[0]));let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))|0;
 return{name:name||(air?'Airline':'Carrier'),mark:b?b[2]:(String(name||'TP').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'TP'),color:b?b[3]:`hsl(${Math.abs(h)%360} 42% 32%)`,logo:logo||(b?b[4]:'')}}

const BLOG_LINK='#/';
/* router */
let timers=[],pending=null;
const nav=$('#nav');addEventListener('scroll',()=>nav.classList.toggle('sc',scrollY>40),{passive:true});
function goSec(id){if(document.body.dataset.v!=='home'){pending=id;location.hash='#/'}else id==='top'?scrollTo({top:0,behavior:'smooth'}):$('#'+id).scrollIntoView({behavior:'smooth'})}
$$('[data-s]').forEach(b=>b.onclick=()=>goSec(b.dataset.s));
function route(){timers.forEach(t=>clearInterval(t));timers=[];
 const m=location.hash.match(/^#\/?(track|pickup|shipment-receipt)\/(.+)$/i),app=$('#app');
 app.classList.remove('in');void app.offsetWidth;app.classList.add('in');scrollTo(0,0);
 if(m){document.body.dataset.v='tk';renderTrack(decodeURIComponent(m[2]))}else{document.body.dataset.v='home';renderHome();if(pending){const p=pending;pending=null;setTimeout(()=>goSec(p),350)}}
 nav.classList.toggle('sc',scrollY>40)}
addEventListener('hashchange',route);
function searchBox(cls){return`<form class="sb ${cls||''}" onsubmit="return go(this)"><input name="n" placeholder="Package or flight tracking number" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Tracking number" required><button class="btn">${ic('search')}Track</button></form>`}
window.go=f=>{const v=f.n.value.trim();if(v)location.hash='#/track/'+encodeURIComponent(v);return false};
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target);const c=e.target.querySelectorAll('[data-n]');c.forEach(count)}}),{threshold:.15});$$('.rv').forEach(x=>io.observe(x))}
function count(el){const n=+el.dataset.n,d=+el.dataset.d,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1600),v=n*(1-Math.pow(1-p,4));el.textContent=v.toFixed(d)+el.dataset.s;if(p<1)requestAnimationFrame(f)})(t0)}
function renderHome(){
 const cht=(a,i)=>`<span class="chip">${a[4]?`<img src="${esc(a[4])}" alt="${esc(a[1])}" onerror="lf(this,'${esc(a[2])}','${esc(a[3])}')">`:`<span class="mk" style="background:${esc(a[3])}">${esc(a[2])}</span>`}${a[4]?'':esc(a[1])}</span>`;
 $('#app').innerHTML=`
<section class="hero" id="top">${HERO.map((s,i)=>`<div class="sl ${i?'':'on'}" style="background-image:url('${s}')"></div>`).join('')}
<div class="wrap"><h1>Know exactly where it is.</h1><p>Follow any package or flight in real time. Status, route, photo and live map, with no account needed.</p>${searchBox()}<div class="hint">Works with package and flight tracking numbers from TrackPort emails.</div></div>
<div class="dots">${HERO.map((s,i)=>`<b class="${i?'':'on'}" tabindex="0" aria-label="Slide ${i+1}"></b>`).join('')}</div></section>
<div class="mqw rv"><div class="mq">${[...TRUST,...TRUST].map(cht).join('')}</div></div>
<section class="sec"><div class="wrap"><div class="stats rv">${STATS.map(s=>`<div><b data-n="${s[0]}" data-d="${s[1]}" data-s="${s[2]}">0</b><span>${s[3]}</span></div>`).join('')}</div></div></section>
<section class="sec" id="services" style="padding-top:20px"><div class="wrap"><div class="sh rv"><h2>Everything about your delivery, in one place.</h2><p>Built for the people waiting for a parcel and the people sending it.</p></div>
<div class="bento">${SERV.map(s=>`<div class="card rv ${s[3]?'w2':''}"><div class="ico">${ic(s[0])}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div></div></section>
<section class="sec" id="how" style="padding-top:20px"><div class="wrap"><div class="sh rv"><h2>Three steps to an answer.</h2></div><div class="steps">${HOW.map(s=>`<div class="card rv"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>
<section class="sec" id="gallery" style="padding-top:20px"><div class="wrap"><div class="sh rv"><h2>Moving the world, carefully.</h2></div><div class="gal">${GAL.map(g=>`<figure class="rv"><img src="${g[0]}" alt="${esc(g[1])}" loading="lazy"><figcaption>${esc(g[1])}</figcaption></figure>`).join('')}</div></div></section>
<section class="sec" id="updates" style="padding-top:20px"><div class="wrap"><div class="sh rv"><h2>Blog and updates.</h2><p>What is new in TrackPort tracking.</p></div><div class="posts">${POSTS.map(p=>`<article class="post rv"><img src="${p[0]}" alt="" loading="lazy"><div><small>${p[1]}</small><h3>${p[2]}</h3><p>${p[3]}</p></div></article>`).join('')}</div></div></section>
<section class="sec" id="reviews" style="padding-top:20px"><div class="wrap"><div class="tst rv"><img src="${IMG.tm}" alt="" loading="lazy"><div>${TEST.map((t,i)=>`<div class="q ${i?'':'on'}"><blockquote>“${t[3]}”</blockquote><div class="who"><img src="${t[0]}" alt=""><div><b>${t[1]}</b><span>${t[2]}</span></div></div></div>`).join('')}<div class="qd">${TEST.map((t,i)=>`<b class="${i?'':'on'}" tabindex="0" aria-label="Review ${i+1}"></b>`).join('')}</div></div></div>
<div class="cms" style="margin-top:34px">${CMS.map(c=>`<div class="cm rv"><img src="${c[0]}" alt=""><div><b>${c[1]}</b><p>${c[2]}</p></div></div>`).join('')}</div></div></section>
<section class="sec" style="padding-top:20px"><div class="wrap"><div class="cta rv" style="--cb:url('${IMG.night}')"><h2>Have a tracking number?</h2>${searchBox()}</div></div></section>`;
 const sl=$$('.sl'),dt=$$('.dots b');let i=0,t;const show=n=>{sl[i].classList.remove('on');dt[i].classList.remove('on');i=(n+sl.length)%sl.length;sl[i].classList.add('on');dt[i].classList.add('on')},rs=()=>{clearInterval(t);t=setInterval(()=>show(i+1),6000);timers.push(t)};
 dt.forEach((d,k)=>d.onclick=()=>{show(k);rs()});rs();
 const qs=$$('.q'),qd=$$('.qd b');let j=0;const sq=n=>{qs[j].classList.remove('on');qd[j].classList.remove('on');j=(n+qs.length)%qs.length;qs[j].classList.add('on');qd[j].classList.add('on')};qd.forEach((d,k)=>d.onclick=()=>sq(k));timers.push(setInterval(()=>sq(j+1),7000));
 reveal()}
/* tracking */
const SF=['Order Created','Picked Up','In Transit','Arrived at Facility','Out for Delivery','Delivered'],FF=['Ticket Booked','Checked In','Boarding','Departed','In Flight','Landed'];
const fd=v=>{const d=new Date(v);return v&&!isNaN(d)?d.toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):(v||'—')};
const ok=v=>Number.isFinite(parseFloat(v))&&v!==null&&v!=='';
const evs=r=>(r.events||[]).slice().sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
function cur(flow,r){if(flow.includes(r.status))return flow.indexOf(r.status);const e=evs(r).find(x=>flow.includes(x.status));return e?flow.indexOf(e.status):0}
const rail=(flow,i)=>`<div class="rail" style="--p:${i/(flow.length-1)*100}%">${flow.map((s,k)=>`<div class="st ${k<i?'dn':''} ${k==i?'ac':''}"><i>${k<i?ic('check'):''}</i>${esc(s)}</div>`).join('')}</div>`;
const col=s=>/deliver(ed)$|^landed|^delivered/i.test(s)?'var(--ok)':/exception|cancel|delay|hold|fail/i.test(s)?'var(--bad)':'var(--ac)';
const hist=r=>`<div class="tc"><h3>Tracking history</h3>${evs(r).map(e=>`<div class="ev"><b>${esc(e.status||'Update')}</b><span>${esc([e.location,fd(e.timestamp||e.time)].filter(Boolean).join(' · '))}</span>${e.description?`<div class="mu" style="font-size:14px">${esc(e.description)}</div>`:''}</div>`).join('')||'<p class="mu">No updates yet.</p>'}</div>`;
const gcache={};async function geo(q){q=String(q||'').trim();if(!q)return null;if(gcache[q]!==undefined)return gcache[q];try{const c=sessionStorage.getItem('g:'+q);if(c)return gcache[q]=JSON.parse(c)}catch(e){}
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)),j=await r.json(),p=j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null;gcache[q]=p;try{sessionStorage.setItem('g:'+q,JSON.stringify(p))}catch(e){}return p}catch(e){return gcache[q]=null}}
function draw(el,pts,c){if(!window.L){el.innerHTML='<p class="mu" style="padding:20px">Map could not load.</p>';return}
 try{draw.m&&draw.m.remove()}catch(e){}
 const m=draw.m=L.map(el,{scrollWheelZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);const b=[];
 pts.forEach(p=>{L.circleMarker([p.lat,p.lng],{radius:6,color:'#FF5E14',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(m).bindTooltip(esc(p.name));b.push([p.lat,p.lng])});
 if(pts.length>1)L.polyline(pts.map(p=>[p.lat,p.lng]),{color:'#FF5E14',weight:3,dashArray:'6 9',opacity:.85}).addTo(m);
 if(c){L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(m).bindPopup(esc(c.label)).openPopup();b.push([c.lat,c.lng])}
 b.length>1?m.fitBounds(b,{padding:[48,48],maxZoom:9}):b[0]?m.setView(b[0],8):m.setView([20,0],2);setTimeout(()=>m.invalidateSize(),300)}
const mapCard=(label)=>`<div class="tc"><div class="mh"><h3>Live location</h3><a class="btn" id="gm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label||'')}">${ic('pin')}Open in Google Maps</a></div><div class="map" id="map"></div></div>`;
function copyBtns(id){return`<div class="tn"><span>${esc(id)}</span><button onclick="cp('${esc(id)}')">${ic('copy')}Copy number</button><button onclick="cp(location.origin+'/?track='+encodeURIComponent('${esc(id)}')+'#/track/'+encodeURIComponent('${esc(id)}'),1)">${ic('link')}Copy link</button></div>`}
window.cp=(t,l)=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()});toast(l?'Tracking link copied':'Tracking number copied')};
async function renderTrack(id){
 const A=$('#app');A.innerHTML=`<section class="tk wrap"><div class="sk"></div><div class="sk" style="height:180px"></div></section>`;
 const res=await lookup(id);if(location.hash.indexOf(encodeURIComponent(id))<0&&location.hash.indexOf(id)<0)return;
 if(!res||res.err){const msg=!res?`We could not find “${esc(id)}”. Check the number for typos and try again.`:res.err==='denied'?'The tracking service is not accepting public lookups right now. Please try again shortly.':'We could not reach the tracking service. Check your connection and try again.';
  A.innerHTML=`<section class="tk wrap"><div class="tc nf"><h1>${!res?'No record found':'Tracking unavailable'}</h1><p class="mu">${msg}</p>${searchBox()}</div></section>`;return}
 const r=res.rec;res.type==='flight'?flightView(A,r):shipView(A,r)}
async function shipView(A,r){
 const b=brand(r.carrier,0,r.carrierLogo),img=r.productImage||r.imageUrl||r.productImageUrl||'',ex=/exception/i.test(r.status),i=cur(SF,r),lat=evs(r).find(e=>ok(e.latitude)&&ok(e.longitude));
 const s=r.shipping||{},sd=r.sender||{},rc=r.recipient||{},cl=r.currentLocation||r.origin||'',F=(k,v)=>v?`<div><span>${k}</span><b>${esc(v)}</b></div>`:'';
 A.innerHTML=`<section class="tk wrap"><a class="bk" href="#/">${ic('back')}New search</a>
<div class="tc top"><div class="pic">${img?`<img src="${esc(img)}" alt="${esc(r.productName||'Package')}" onerror="this.remove()">`:IC.box&&`<svg viewBox="0 0 24 24">${IC.box}</svg>`}</div><div>${badge(b)}<h1>${esc(r.productName||'Your package')}</h1>${copyBtns(r.trackingNumber)}<div class="pill" style="--c:${col(r.status)}">${esc(r.status||'In progress')}</div>${r.eta?`<div class="mu" style="margin-top:12px">Estimated delivery: <b style="color:var(--ink)">${esc(fd(r.eta))}</b></div>`:''}</div></div>
<div class="tc"><h3>Delivery progress</h3>${rail(SF,i)}${ex?`<div class="ban">${ic('alert').replace('<svg','<svg width="22" style="stroke:currentColor;fill:none;stroke-width:2;flex:none"')}<div><b>Delivery exception reported.</b> ${esc((evs(r).find(e=>/exception/i.test(e.status))||{}).description||'The carrier flagged an issue with this delivery.')}</div></div>`:''}
<div class="bp" style="margin-top:30px"><div><b style="font-size:clamp(28px,5vw,48px)">${esc(r.origin||sd.city||'—')}</b><span>Origin</span></div>${ic('box')}<div><b style="font-size:clamp(28px,5vw,48px)">${esc(r.destination||rc.city||'—')}</b><span>Destination</span></div></div></div>
${mapCard(cl)}
<div class="tc"><h3>Shipment details</h3><div class="grid">${F('Current location',cl)}${F('Carrier',r.carrier)}${F('Service',r.method)}${F('Package type',r.packageType)}${F('Category',r.category)}${F('Quantity',r.quantity)}${F('Weight',r.weight?r.weight+' kg':'')}${F('Dimensions',r.dimensions)}${F('Sender',sd.name)}${F('Recipient',rc.name)}${F('Created',r.created?fd(r.created):'')}</div>${r.description?`<p class="mu" style="margin-top:18px">${esc(r.description)}</p>`:''}</div>${hist(r)}</section>`;
 let c=lat?{lat:+lat.latitude,lng:+lat.longitude,label:lat.location||cl}:ok(s.latitude)&&ok(s.longitude)?{lat:+s.latitude,lng:+s.longitude,label:'Package location'}:null;
 draw($('#map'),[],c);const pts=[];
 const [o,d,g]=await Promise.all([geo(r.origin),geo(r.destination),c?null:geo(cl)]);if(!$('#map'))return;
 if(!c&&g)c={...g,label:cl||'Latest reported location'};if(o)pts.push({...o,name:'Origin: '+r.origin});if(d)pts.push({...d,name:'Destination: '+r.destination});
 draw($('#map'),pts,c);if(c)$('#gm').href=`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`}
async function flightView(A,r){
 const b=brand(r.airline,1,r.airlineLogo),i=cur(FF,r),stops=(r.routeStops||[]).filter(x=>ok(x.latitude)&&ok(x.longitude)),late=evs(r).find(e=>ok(e.latitude)&&ok(e.longitude)),
 st=(r.routeStops||[]).find(x=>x.id===r.currentLocationId),F=(k,v)=>v?`<div><span>${k}</span><b>${esc(v)}</b></div>`:'';
 let c=late?{lat:+late.latitude,lng:+late.longitude,label:late.location||r.currentLocation}:st&&ok(st.latitude)?{lat:+st.latitude,lng:+st.longitude,label:r.currentLocation||st.name}:null;
 A.innerHTML=`<section class="tk wrap"><a class="bk" href="#/">${ic('back')}New search</a>
<div class="tc"><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center">${badge(b)}<span class="mu">Flight <b style="color:var(--ink)">${esc(r.flightNo||'')}</b></span></div>
<div class="bp" style="margin:34px 0 26px"><div><b>${esc(r.originCode||(r.origin||'').slice(0,3).toUpperCase())}</b><span>${esc(r.origin||'')}</span></div>${ic('plane')}<div><b>${esc(r.destinationCode||(r.destination||'').slice(0,3).toUpperCase())}</b><span>${esc(r.destination||'')}</span></div></div>
<div style="text-align:center">${copyBtns(r.trackingNumber).replace('class="tn"','class="tn" style="justify-content:center"')}<div class="pill" style="--c:${col(r.status)}">${esc(r.status||'Scheduled')}</div></div></div>
<div class="tc"><h3>Flight progress</h3>${rail(FF,i)}</div>${mapCard(r.currentLocation||r.origin)}
<div class="tc"><h3>Flight details</h3><div class="grid">${F('Passenger',r.passenger)}${F('Departure',fd(r.departure||(r.date&&r.date+'T'+(r.time||'00:00'))))}${F('Cabin',r.cabin)}${F('Seat',r.seat)}${F('Gate',r.gate)}${F('Terminal',r.terminal)}${F('Boarding group',r.boardingGroup)}${F('Current location',r.currentLocation)}</div></div>${hist(r)}</section>`;
 const pts=stops.map(x=>({lat:+x.latitude,lng:+x.longitude,name:x.name}));draw($('#map'),pts,c);
 if(pts.length<2||!c){const [o,d,g]=await Promise.all([pts.length<2?geo(r.origin):null,pts.length<2?geo(r.destination):null,c?null:geo(r.currentLocation)]);if(!$('#map'))return;
  const p=pts.length<2?[o&&{...o,name:r.origin},d&&{...d,name:r.destination}].filter(Boolean):pts;if(!c&&g)c={...g,label:r.currentLocation};draw($('#map'),p,c)}
 if(c)$('#gm').href=`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`}
route();
</script>
