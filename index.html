  <style>
    :root{--primary:#D4AF5A;--primary-light:rgba(212,175,90,.16);--success:#57C08D;--success-light:rgba(87,192,141,.14);--warning:#E3A548;--warning-light:rgba(227,165,72,.14);--error:#E2636B;--error-light:rgba(226,99,107,.14);--ink:#F3F1EA;--bg:#0A0B12;--dark:#050609;--card:rgba(24,26,38,.72);--border:rgba(255,255,255,.1);--glass-border:rgba(255,255,255,.14);--muted:#9AA1B4;--shadow:0 10px 34px rgba(0,0,0,.32);--shadow-lift:0 10px 24px rgba(0,0,0,.4),0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 620px at 2% -4%,rgba(212,175,90,.2),transparent 64%),radial-gradient(820px 640px at 100% 4%,rgba(102,92,225,.18),transparent 62%),linear-gradient(135deg,#080A12,#101322 48%,#090B13);background-attachment:fixed;color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(560px 440px at 14% 18%,rgba(255,255,255,.08),transparent 68%),radial-gradient(680px 520px at 86% 78%,rgba(92,82,226,.14),transparent 70%);filter:blur(42px);opacity:.8}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}.wrap{width:min(1160px,calc(100% - 48px));margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px max(24px,calc((100% - 1160px)/2));border-bottom:1px solid var(--glass-border);background:rgba(5,6,9,.58);backdrop-filter:blur(22px);position:relative;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",serif;font-size:20px;font-weight:900;letter-spacing:-.02em}.brand-mark{width:30px;height:30px;border:1px solid var(--primary);border-radius:50%;display:grid;place-items:center;color:var(--primary);font:600 12px "IBM Plex Mono",monospace;box-shadow:0 0 24px rgba(212,175,90,.2)}.topnav{display:flex;gap:22px}.topnav a{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}.topnav a:hover{color:var(--ink)}.hero{background:var(--dark);color:#fff;padding:48px 0 44px;text-align:center}.hero h1{font:700 30px "Playfair Display",serif;margin:0 0 10px}.hero p{color:#CBD5E1;margin:0 auto;max-width:620px;line-height:1.65;font-size:14px}.hero-code{color:#E7CE93;font-size:12.5px;letter-spacing:.04em;display:block;margin-bottom:6px}.summary{max-width:820px;width:100%;margin:-40px auto 0;padding:0 24px 60px}.card{background:var(--card);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(22px)}.card-pad{padding:28px}.summary-card{padding:28px;margin-bottom:24px}.summary-top{display:flex;align-items:center;gap:16px;margin-bottom:24px}.summary-top img,.image-fallback{width:72px;height:72px;border-radius:16px;object-fit:cover;border:1px solid var(--border);background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}.summary-top h2{font:700 24px "Playfair Display",serif;margin:0}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;border-top:1px solid var(--border);padding-top:22px}.summary-grid .k,.ticket-meta .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.summary-grid .v,.ticket-meta .v{font-size:14px;font-weight:600;overflow-wrap:anywhere}.summary-grid svg{width:13px;height:13px;vertical-align:-2px;color:var(--primary);margin-right:4px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;white-space:nowrap}.badge svg{width:13px;height:13px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.section-title h3{font:700 20px "Playfair Display",serif;margin:0}.section-title span{font-size:12px;color:var(--muted)}.tracking-map{height:320px;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#dbe5ef}.tracking-map-note{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;color:var(--muted);font-size:13px}.tracking-map-note strong{color:var(--ink)}.route-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.route-list{border:1px solid var(--border);border-radius:14px;padding:8px;background:rgba(255,255,255,.025);overflow:auto;max-height:340px}.route-row{display:flex;align-items:flex-start;gap:10px;padding:12px 9px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.route-row:last-child{border-bottom:0}.route-row.current{background:rgba(212,175,90,.1);border-radius:10px}.route-marker{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--muted);font:600 11px "IBM Plex Mono",monospace;flex:0 0 auto}.route-row.current .route-marker{background:var(--primary);color:#16120A}.route-name{display:block;font-weight:600}.route-kind{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}.map-empty{min-height:180px;display:grid;place-items:center;padding:24px;color:var(--muted);font-size:13px;text-align:center}.timeline{position:relative;display:flex;justify-content:space-between;padding:10px 6px 0;margin-bottom:8px}.timeline:before{content:"";position:absolute;top:23px;left:24px;right:24px;height:3px;background:var(--border);border-radius:2px}.timeline .fill{position:absolute;top:23px;left:24px;height:3px;background:var(--success);border-radius:2px}.step{position:relative;z-index:1;text-align:center;width:14%;font-size:10px;color:var(--muted)}.step-dot{margin:0 auto 8px;width:26px;height:26px;border-radius:50%;border:3px solid var(--bg);background:#303442;display:grid;place-items:center}.step.complete .step-dot{background:var(--success);color:#08110d}.step.active .step-dot{background:var(--primary);box-shadow:0 0 0 5px rgba(212,175,90,.12)}.step-dot svg{width:13px;height:13px}.pulse{width:7px;height:7px;border-radius:50%;background:#16120A}.step-label{display:block;line-height:1.25}.events{display:flex;flex-direction:column;margin-top:22px}.event{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:0 0 20px}.event-rail{position:relative}.event-rail:after{content:"";position:absolute;top:10px;bottom:-20px;left:6px;width:1px;background:var(--border)}.event:last-child .event-rail:after{display:none}.event-dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--bg);position:relative;z-index:1}.event-status{font-size:14px;font-weight:700}.event-location{color:var(--muted);font-size:13px;margin-top:5px}.event-location svg{width:13px;height:13px;vertical-align:-2px;color:var(--primary)}.event-time{font:11px "IBM Plex Mono",monospace;color:var(--muted);margin-top:7px}.event-note{color:#CBD5E1;font-size:12px;line-height:1.5;margin-top:7px}.exception{display:flex;gap:10px;padding:14px;border-radius:12px;background:var(--error-light);color:#ffd8da;font-size:13px;margin-top:18px}.exception svg{color:var(--error);flex:0 0 auto}.ticket{padding:0;overflow:hidden;background:linear-gradient(135deg,#14151F,#0D0E15);border:1px solid var(--border);box-shadow:var(--shadow-lift)}.ticket-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:28px}.airport:last-child{text-align:right}.airport-code{font:600 30px "IBM Plex Mono",monospace}.airport-name{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}.plane{color:var(--primary);text-align:center}.ticket-rule{border-top:2px dashed var(--border);margin:0 28px}.ticket-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:22px 28px}.ticket-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 28px;border-top:1px solid var(--border);background:rgba(255,255,255,.02)}.ticket-number{font:13px "IBM Plex Mono",monospace;color:#E7CE93}.search-panel{max-width:600px;margin:30px auto 70px;padding:0 24px}.search-panel .card{padding:26px}.search-panel h2{font:700 23px "Playfair Display",serif;margin:0 0 8px}.search-panel p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 18px}.search-form{display:flex;gap:10px}.search-form input{min-width:0;flex:1;padding:13px 14px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(0,0,0,.2);color:var(--ink);font:13px "IBM Plex Mono",monospace;outline:none}.search-form input:focus{border-color:var(--primary)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:700}.btn svg{width:15px;height:15px}.btn-accent{background:var(--primary);color:#16120A}.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--ink)}.error-box{max-width:600px;margin:30px auto 70px;padding:0 24px}.error-box .card{padding:30px;text-align:center}.error-box h2{font:700 24px "Playfair Display",serif;margin:10px 0}.error-box p{color:var(--muted);font-size:13px;line-height:1.6}.footer{border-top:1px solid var(--glass-border);padding:30px 24px 24px;color:var(--muted);font-size:11px;text-align:center;letter-spacing:.04em}.loading{min-height:45vh;display:grid;place-items:center;color:var(--muted);font:12px "IBM Plex Mono",monospace}@media(max-width:760px){.wrap{width:min(100% - 32px,620px)}.topbar{padding:18px 16px}.topnav{gap:12px}.summary{padding-left:16px;padding-right:16px}.summary-card,.card-pad{padding:20px}.summary-grid{grid-template-columns:1fr}.route-layout{grid-template-columns:1fr}.route-list{max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.ticket-top{padding:20px}.airport-code{font-size:22px}.ticket-meta{grid-template-columns:1fr 1fr;padding:20px}.tracking-map{height:260px}}@media(max-width:520px){.brand{font-size:17px}.topnav a{font-size:10px}.hero h1{font-size:26px}.summary-top h2{font-size:20px}.route-list{grid-template-columns:1fr}.search-form{flex-direction:column}.ticket-top{gap:8px}.airport-name{font-size:10px}.ticket-rule{margin:0 20px}.ticket-bottom{padding:16px 20px}.step{font-size:9px}.step-dot{width:22px;height:22px}}
  </style>

<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Tracking home"><span class="brand-mark">TP</span><span>TrackPort</span></a>
    <nav class="topnav" aria-label="Tracking navigation"><a href="#tracking-search">Track</a><a href="#tracking-about">About</a></nav>
  </header>
  <main id="app"><div class="loading">Loading tracking service…</div></main>
  <footer class="footer" id="tracking-about">Read-only tracking information · Published updates may change as movement is reported.</footer>
  <script>
    /* This page intentionally has no authentication, write operations, or link
       back to the creator application. It reads the same two public state
       documents used by the creator application. */
    const firebaseConfig = {
      apiKey: "AIzaSyD9HUq3XpfagPsGByZMbGG_E8T43hAjKFM",
      authDomain: "nbatools-38be3.firebaseapp.com",
      projectId: "nbatools-38be3",
      storageBucket: "nbatools-38be3.firebasestorage.app",
      messagingSenderId: "275083219856",
      appId: "1:275083219856:web:762d3127dd6370ded09915"
    };
    const STATUS_FLOW = ['Order Created','Shipment Confirmed','Picked Up','In Transit','Arrived at Facility','Out for Delivery','Delivered'];
    const ALL_STATUSES = [...STATUS_FLOW, 'Delivery Exception'];
    const FLIGHT_FLOW = ['Ticket Booked','Checked In','Boarding','Departed','In Flight','Landed'];
    let shipments = {}, flights = {}, listeners = [];

    const $ = (selector, root=document) => root.querySelector(selector);
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const icon = name => `<i data-feather="${name}" aria-hidden="true"></i>`;
    const fmtDate = value => { if(!value) return '—'; const date = new Date(value); return Number.isNaN(date.getTime()) ? esc(value) : date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); };
    const fmtDateTime = value => { if(!value) return '—'; const date = new Date(value); return Number.isNaN(date.getTime()) ? esc(value) : date.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };
    const safe = (object, path, fallback='—') => path.split('.').reduce((value, key) => value && value[key] != null ? value[key] : undefined, object) ?? fallback;
    function renderIcons(){ if(window.feather) feather.replace(); }
    function statusColor(status){
      if(status === 'Delivered' || status === 'Landed') return {bg:'var(--success-light)',fg:'var(--success)'};
      if(status === 'Delivery Exception') return {bg:'var(--error-light)',fg:'var(--error)'};
      if(status === 'Out for Delivery' || status === 'Boarding' || status === 'Departed') return {bg:'var(--warning-light)',fg:'var(--warning)'};
      if(status === 'Order Created' || status === 'Ticket Booked') return {bg:'rgba(255,255,255,.06)',fg:'var(--muted)'};
      return {bg:'var(--primary-light)',fg:'var(--primary)'};
    }
    function statusIcon(status){ return status === 'Delivered' || status === 'Landed' ? 'check-circle' : status === 'Delivery Exception' ? 'alert-triangle' : status === 'Out for Delivery' || status === 'In Transit' || status === 'Departed' || status === 'In Flight' ? 'truck' : 'clock'; }
    function badge(status){
      const color = statusColor(status || 'Order Created');
      return `<span class="badge" style="background:${color.bg};color:${color.fg}">${icon(statusIcon(status))}${esc(status || 'Unknown')}</span>`;
    }
    function normalizeRecords(value){ try{ const data = JSON.parse(value || '{}'); return data && typeof data === 'object' ? data : {}; }catch(_error){ return {}; } }
    function routeText(value){ return String(value || '').trim(); }
    function routeStops(record, type){
      const stored = type === 'shipment' ? safe(record,'shipping.routeStops',null) : record.routeStops;
      if(Array.isArray(stored) && stored.length) return stored;
      const origin = type === 'shipment' ? safe(record,'sender.city','Origin') : (record.origin || 'Origin');
      const destination = type === 'shipment' ? safe(record,'recipient.city','Destination') : (record.destination || 'Destination');
      return [{id:'origin',name:routeText(origin),kind:'Origin'},{id:'destination',name:routeText(destination),kind:'Destination'}];
    }
    function currentLocation(record, type){
      const events = Array.isArray(record.events) ? record.events.slice().sort((a,b)=>new Date(b.timestamp || 0)-new Date(a.timestamp || 0)) : [];
      const event = events.find(item => Number.isFinite(Number(item.latitude)) && Number.isFinite(Number(item.longitude)));
      if(event) return {latitude:Number(event.latitude),longitude:Number(event.longitude),label:event.location || 'Latest reported location',timestamp:event.timestamp};
      const source = type === 'shipment' ? record.shipping || {} : record;
      const latitude = Number(source.latitude), longitude = Number(source.longitude);
      return Number.isFinite(latitude) && Number.isFinite(longitude) ? {latitude,longitude,label:events[0]?.location || 'Latest reported location',timestamp:events[0]?.timestamp || record.updatedAt} : null;
    }
    function mapCard(record, type, title, subtitle){
      const stops = routeStops(record,type), location = currentLocation(record,type);
      const selected = (record.events || []).slice().sort((a,b)=>new Date(b.timestamp || 0)-new Date(a.timestamp || 0))[0]?.routeStopId || stops[0]?.id;
      const mapStops = stops.filter(stop=>Number.isFinite(Number(stop.latitude)) && Number.isFinite(Number(stop.longitude))).map(stop=>({...stop,latitude:Number(stop.latitude),longitude:Number(stop.longitude)}));
      if(location && !mapStops.some(stop=>stop.latitude === location.latitude && stop.longitude === location.longitude)) mapStops.push({id:'current',name:location.label,kind:'Current location',latitude:location.latitude,longitude:location.longitude});
      const rows = stops.map((stop,index)=>`<div class="route-row ${stop.id === selected ? 'current' : ''}"><span class="route-marker">${stop.id === selected ? '●' : index + 1}</span><span><span class="route-name">${esc(stop.name || 'Route location')}</span><span class="route-kind">${index === 0 ? 'Origin' : index === stops.length - 1 ? 'Destination' : 'Stopover'} · ${esc(stop.kind || 'Location')}</span></span></div>`).join('');
      return `<section class="card card-pad"><div class="section-title"><h3>${esc(title)}</h3><span>${esc(subtitle)}</span></div>${location ? `<div class="tracking-map-note"><strong>${esc(location.label)}</strong><span class="mono">Updated ${fmtDateTime(location.timestamp)}</span></div>` : ''}<div class="route-layout">${mapStops.length ? `<div class="tracking-map" data-route-map data-stops="${esc(JSON.stringify(mapStops))}" data-current-id="${esc(selected || 'current')}"></div>` : `<div class="tracking-map map-empty">Route coordinates are not available yet. Progress updates are still shown below.</div>`}<div class="route-list">${rows || '<div class="map-empty">No route stops have been published.</div>'}</div></div></section>`;
    }
    function timeline(record, type){
      const flow = type === 'shipment' ? STATUS_FLOW : FLIGHT_FLOW, status = record.status || flow[0], index = Math.max(0, flow.indexOf(status)), fill = flow.length > 1 ? (index / (flow.length - 1)) * 100 : 0;
      const steps = flow.map((name, i)=>`<div class="step ${i < index ? 'complete' : i === index ? 'active' : ''}"><div class="step-dot">${i < index ? icon('check') : i === index ? '<span class="pulse"></span>' : ''}</div><span class="step-label">${esc(name)}</span></div>`).join('');
      const events = (record.events || []).slice().sort((a,b)=>new Date(b.timestamp || 0)-new Date(a.timestamp || 0));
      const eventsHtml = events.map(event=>{ const color = statusColor(event.status); return `<div class="event"><div class="event-rail"><div class="event-dot" style="background:${color.fg}"></div></div><div><div class="event-status" style="color:${color.fg}">${esc(event.status || 'Update')}</div>${event.location ? `<div class="event-location">${icon('map-pin')} ${esc(event.location)}</div>` : ''}<div class="event-time">${fmtDateTime(event.timestamp)}</div>${event.description ? `<div class="event-note">“${esc(event.description)}”</div>` : ''}</div></div>`; }).join('') || '<div style="color:var(--muted);font-size:13px">No tracking events yet.</div>';
      const exception = status === 'Delivery Exception' ? `<div class="exception">${icon('alert-triangle')}<span><strong>Delivery exception reported.</strong> ${esc(events.find(event=>event.status === 'Delivery Exception')?.description || 'The carrier flagged an issue with this shipment.')}</span></div>` : '';
      return `<section class="card card-pad"><div class="timeline"><div class="fill" style="width:${fill}%"></div>${steps}</div>${exception}<div class="section-title" style="margin-top:26px"><h3>${type === 'shipment' ? 'Tracking history' : 'Flight history'}</h3></div><div class="events">${eventsHtml}</div></section>`;
    }
    function shipmentPage(record){
      const shipping = record.shipping || {}, sender = record.sender || {}, recipient = record.recipient || {};
      return `<div class="hero"><div class="wrap"><span class="hero-code mono">TRACKING NUMBER</span><h1 class="mono">${esc(record.trackingNumber)}</h1><p>Read-only movement updates for this shipment.</p></div></div><div class="summary"><section class="card summary-card"><div class="summary-top">${record.imageUrl ? `<img src="${esc(record.imageUrl)}" alt="">` : `<div class="image-fallback">${icon('package')}</div>`}<div><h2>${esc(record.productName || 'Shipment')}</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px">${badge(record.status)}${shipping.carrier ? `<span style="color:var(--muted);font-size:12px">${esc(shipping.carrier)}</span>` : ''}</div></div></div><div class="summary-grid"><div><div class="k">${icon('user')} Sender</div><div class="v">${esc(sender.fullName || '—')}</div></div><div><div class="k">${icon('user')} Recipient</div><div class="v">${esc(recipient.fullName || '—')}</div></div><div><div class="k">${icon('map-pin')} Origin</div><div class="v">${esc(sender.city || '—')}, ${esc(sender.country || '')}</div></div><div><div class="k">${icon('map-pin')} Destination</div><div class="v">${esc(recipient.city || '—')}, ${esc(recipient.country || '')}</div></div><div><div class="k">${icon('truck')} Method</div><div class="v">${esc(shipping.method || '—')}</div></div><div><div class="k">${icon('calendar')} Est. delivery</div><div class="v">${fmtDate(shipping.eta)}</div></div></div></section>${mapCard(record,'shipment','Live package route',`${shipping.method || 'Shipping'} · read-only`)}${timeline(record,'shipment')}</div>`;
    }
    function airport(value){ const parts = String(value || '—').split(/\s*[·|—-]\s*/).filter(Boolean); return parts.length > 1 ? {code:parts.shift().toUpperCase(),name:parts.join(' ').toUpperCase()} : {code:String(value || '—').toUpperCase(),name:String(value || '—').toUpperCase()}; }
    function flightPage(record){
      const from = airport(record.origin), to = airport(record.destination), routeDate = record.departure ? fmtDate(record.departure) : '—';
      return `<div class="hero"><div class="wrap"><span class="hero-code mono">FLIGHT TRACKING NUMBER</span><h1 class="mono">${esc(record.trackingNumber)}</h1><p>Read-only movement updates for this flight.</p></div></div><div class="summary"><section class="card ticket"><div class="ticket-top"><div class="airport"><div class="airport-code">${esc(from.code)}</div><div class="airport-name">${esc(from.name)}</div></div><div class="plane">${icon('send')}</div><div class="airport"><div class="airport-code">${esc(to.code)}</div><div class="airport-name">${esc(to.name)}</div></div></div><div class="ticket-rule"></div><div class="ticket-meta"><div><div class="k">Passenger</div><div class="v">${esc(record.passenger || '—')}</div></div><div><div class="k">Airline</div><div class="v">${esc(record.airline || '—')}</div></div><div><div class="k">Flight</div><div class="v mono">${esc(record.flightNo || '—')}</div></div><div><div class="k">Departure</div><div class="v">${esc(routeDate)}</div></div></div><div class="ticket-bottom"><span>${badge(record.status)}</span><span class="ticket-number">${esc(record.trackingNumber)}</span></div></section>${mapCard(record,'flight','Live flight route',`${record.airline || 'Airline'} · ${record.flightNo || 'Flight'}`)}${timeline(record,'flight')}</div>`;
    }
    function searchPage(message=''){
      return `<div class="search-panel" id="tracking-search"><section class="card"><h2>Track a shipment or flight</h2><p>Enter the tracking number from your tracking message.</p><form id="search-form" class="search-form"><input id="search-input" class="mono" placeholder="SHP-2026-8F42K9 or FLT-2026-8F42K9" autocomplete="off"><button class="btn btn-accent" type="submit">${icon('search')} Track</button></form>${message ? `<p style="color:var(--error);margin:14px 0 0">${icon('alert-triangle')} ${esc(message)}</p>` : ''}</section></div>`;
    }
    function errorPage(message){ return `<div class="error-box"><section class="card"><div style="color:var(--error)">${icon('alert-triangle')}</div><h2>Tracking temporarily unavailable</h2><p>${esc(message)}</p></section></div>`; }
    function trackingCode(){ const query = new URLSearchParams(location.search).get('tracking'); if(query) return query.trim().toUpperCase(); const hash = location.hash.replace(/^#\/?track\/?/,'').split('/')[0]; return decodeURIComponent(hash || '').trim().toUpperCase(); }
    function recordFor(code){ return code.startsWith('FLT-') ? {record:flights[code],type:'flight'} : {record:shipments[code],type:'shipment'}; }
    function render(message=''){
      const code = trackingCode(), result = recordFor(code);
      $('#app').innerHTML = code ? result.record ? (result.type === 'flight' ? flightPage(result.record) : shipmentPage(result.record)) : errorPage(`We couldn't find a shipment or flight with tracking number ${code}.`) : searchPage(message);
      renderIcons(); wireMaps(); wireSearch();
    }
    function wireSearch(){ const form = $('#search-form'); if(!form || form.dataset.wired) return; form.dataset.wired='1'; form.addEventListener('submit', event=>{ event.preventDefault(); const code = $('#search-input')?.value.trim().toUpperCase(); if(code) location.href = `?tracking=${encodeURIComponent(code)}`; }); }
    function wireMaps(){ if(typeof L === 'undefined') return; document.querySelectorAll('[data-route-map]').forEach(element=>{ if(element.dataset.wired) return; element.dataset.wired='1'; let points=[]; try{ points=JSON.parse(element.dataset.stops || '[]'); }catch(_error){} if(!points.length) return; const map=L.map(element,{scrollWheelZoom:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map); const line=points.map(point=>[point.latitude,point.longitude]); if(line.length > 1) L.polyline(line,{color:'#CDAE5A',weight:4,opacity:.85,dashArray:'8 8'}).addTo(map); const layers=points.map((point,index)=>{ const current=point.id === element.dataset.currentId; const marker=L.circleMarker([point.latitude,point.longitude],{radius:current?9:6,color:current?'#16120A':'#fff',weight:current?3:2,fillColor:current?'#CDAE5A':'#4C5E78',fillOpacity:1}).addTo(map); marker.bindPopup(`<strong>${esc(point.name || 'Route location')}</strong><br><span>${esc(point.kind || 'Location')}</span>`); if(current) marker.openPopup(); return marker; }); const bounds=L.featureGroup(layers).getBounds(); if(bounds.isValid()) map.fitBounds(bounds.pad(.16),{maxZoom:12}); setTimeout(()=>map.invalidateSize(),0); }); }
    function listen(){
      let app; try{ app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig); }catch(error){ $('#app').innerHTML = errorPage('Firebase could not be initialized. Check the hosted site configuration.'); return; }
      const db = firebase.firestore(app);
      const attach = (key, setter) => db.collection('nbatoolsState').doc(key).onSnapshot(snapshot=>{ setter(snapshot.exists ? normalizeRecords(snapshot.data()?.value) : {}); render(); }, error=>{ console.warn(`Could not read ${key}`,error); if(!trackingCode()) render('The tracking service could not be reached. Please try again.'); });
      listeners.push(attach('shared:nbatools-shipments', value=>shipments=value));
      listeners.push(attach('shared:nbatools-flights', value=>flights=value));
    }
    window.addEventListener('hashchange', ()=>render());
    window.addEventListener('DOMContentLoaded', ()=>{ render(); listen(); });
  </script>
</body>
</html>
